<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" fill="none">
  <defs>
    <linearGradient id="yellowSlashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffb7d" />
      <stop offset="45%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#ffcc00" />
    </linearGradient>
    <linearGradient id="blueSlashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="60%" stop-color="#0052ff" />
      <stop offset="100%" stop-color="#021447" />
    </linearGradient>
    <filter id="neonYellowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neonBlueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Blue Energy Under-Slash -->
  <g filter="url(#neonBlueGlow)" opacity="0.85">
    <polygon points="180,0 260,0 490,260 410,260" fill="url(#blueSlashGrad)" />
    <polygon points="290,0 340,0 520,200 470,200" fill="url(#blueSlashGrad)" opacity="0.7" />
    <polygon points="120,40 170,40 340,240 290,240" fill="#0038cc" opacity="0.6" />
  </g>

  <!-- Sharp Geometric Electric Yellow Speed Blades -->
  <g filter="url(#neonYellowGlow)">
    <!-- Primary Heavy Blade -->
    <polygon points="320,0 470,0 540,110 420,180 260,110" fill="url(#yellowSlashGrad)" />
    <!-- Sweeping Diagonal Runner -->
    <polygon points="360,0 440,0 210,320 150,300" fill="url(#yellowSlashGrad)" />
    <!-- Secondary Sharp Chevrons -->
    <polygon points="460,40 530,40 380,260 320,240" fill="url(#yellowSlashGrad)" />
    <!-- Dynamic Angular Slash Splinters -->
    <polygon points="240,160 280,140 310,180 270,210" fill="#ffffff" opacity="0.9" />
    <polygon points="190,240 230,225 250,260 210,280" fill="url(#yellowSlashGrad)" />
    <polygon points="480,120 540,120 510,170 460,150" fill="url(#yellowSlashGrad)" />
    <polygon points="390,210 430,200 410,245 370,240" fill="#ffffff" opacity="0.85" />
    <!-- Fine Speed Linework -->
    <line x1="160" y1="280" x2="280" y2="120" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <line x1="220" y1="310" x2="340" y2="160" stroke="#ffe600" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  </g>
</svg>
